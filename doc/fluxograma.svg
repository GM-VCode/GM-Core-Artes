<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do repositório GM Core Artes</title>
  <desc id="desc">As imagens e o catálogo são publicados no GitHub privado e consumidos pelo projeto GM Core.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#75839a"/></marker>
    <style>.box{fill:#17243a;stroke:#65a5ff;stroke-width:2}.out{fill:#17372f;stroke:#58d6a2;stroke-width:2}.t{fill:#f4f7ff;font:16px Arial,sans-serif;text-anchor:middle}.line{fill:none;stroke:#75839a;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="280" rx="18" fill="#0d1422"/>
  <text x="600" y="42" class="t" style="font-size:24px;font-weight:bold">Biblioteca privada de artes</text>
  <rect class="box" x="35" y="105" width="190" height="76" rx="12"/><text class="t" x="130" y="137"><tspan x="130">Imagens em</tspan><tspan x="130" dy="22">assets/</tspan></text>
  <rect class="box" x="275" y="105" width="190" height="76" rx="12"/><text class="t" x="370" y="137"><tspan x="370">Atualizar</tspan><tspan x="370" dy="22">assets.json</tspan></text>
  <rect class="box" x="515" y="105" width="190" height="76" rx="12"/><text class="t" x="610" y="137"><tspan x="610">Commit e push</tspan><tspan x="610" dy="22">branch main</tspan></text>
  <rect class="box" x="755" y="105" width="190" height="76" rx="12"/><text class="t" x="850" y="137"><tspan x="850">GitHub</tspan><tspan x="850" dy="22">privado</tspan></text>
  <rect class="out" x="995" y="105" width="170" height="76" rx="12"/><text class="t" x="1080" y="137"><tspan x="1080">Projeto</tspan><tspan x="1080" dy="22">GM Core</tspan></text>
  <path class="line" d="M225 143 H275"/><path class="line" d="M465 143 H515"/><path class="line" d="M705 143 H755"/><path class="line" d="M945 143 H995"/>
</svg>
